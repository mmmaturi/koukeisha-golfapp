/* =========================================================
   EVENT HANDLERS
   ========================================================= */
function attachHandlers() {
  // round card click
  document.querySelectorAll('[data-round-id]').forEach(el => {
    el.onclick = () => setView('detail', { detailId: el.dataset.roundId });
  });
  // back: route depending on current view
  const back = document.getElementById('back-btn');
  if (back) back.onclick = () => {
    if (currentView === 'member-edit') setView('settings');
    else if (currentView === 'add-round' && editingRoundId) setView('detail', { detailId: editingRoundId });
    else setView('timeline');
  };

  // detail-view photo click → lightbox
  document.querySelectorAll('.detail-photo[data-photo-idx]').forEach(el => {
    el.onclick = () => {
      const round = state.rounds.find(r => r.id === currentDetailId);
      if (!round) return;
      const idx = parseInt(el.dataset.photoIdx) || 0;
      openLightbox(round.photos, idx);
    };
  });

  // detail-view scorecard sort
  document.querySelectorAll('th[data-sort-key]').forEach(th => {
    th.onclick = () => {
      detailSortKey = th.dataset.sortKey;
      render();
    };
  });

  // edit / delete in detail view
  const editBtn = document.getElementById('edit-round-btn');
  if (editBtn) editBtn.onclick = () => {
    const round = state.rounds.find(r => r.id === currentDetailId);
    if (round) {
      initDraft(round);
      setView('add-round');
    }
  };
  const deleteBtn = document.getElementById('delete-round-btn');
  if (deleteBtn) deleteBtn.onclick = async () => {
    const round = state.rounds.find(r => r.id === currentDetailId);
    if (!round) return;
    if (!confirm(`「${round.course}（${fmtDate(round.date)}）」を削除しますか？元に戻せません。`)) return;
    try {
      // delete associated photos from Storage first
      for (const p of (round.photos || [])) {
        if (p.path) {
          try { await deleteObject(storageRef(storage, p.path)); } catch(e) { /* ignore */ }
        }
      }
      await deleteDoc(doc(db, 'rounds', currentDetailId));
      setView('timeline');
    } catch(err) {
      console.error(err);
      alert('削除に失敗しました：' + (err.message || err));
    }
  };

  // stats player picker
  document.querySelectorAll('[data-player]').forEach(el => {
    if (el.dataset.player && !el.dataset.hole) {
      el.onclick = () => setView('stats', { playerId: el.dataset.player });
    }
  });

  // settings: theme
  document.querySelectorAll('[data-theme-id]').forEach(el => {
    el.onclick = () => { applyTheme(el.dataset.themeId); render(); };
  });
  const exportBtn = document.getElementById('export-data');
  if (exportBtn) exportBtn.onclick = exportData;
  const resetBtn = document.getElementById('reset-data');
  if (resetBtn) resetBtn.onclick = () => {
    alert('Firebase版では「サンプルデータに戻す」は無効です。データは全員で共有されているため、個別のラウンド削除で対応してください。');
  };
  const addMember = document.getElementById('add-member');
  if (addMember) addMember.onclick = async () => {
    const name = prompt('追加するメンバーの名前を入力してください');
    if (!name) return;
    const initial = name.trim().charAt(0);
    try {
      const ref = await addDoc(collection(db, 'members'), {
        name: name.trim(), initial, yomi: '', aliases: []
      });
      setView('member-edit', { memberId: ref.id });
    } catch(err) {
      alert('追加に失敗しました：' + (err.message || err));
    }
  };

  // member edit: open edit screen on row click
  document.querySelectorAll('[data-edit-member]').forEach(el => {
    el.onclick = () => setView('member-edit', { memberId: el.dataset.editMember });
  });

  // change "me" (current user) on settings page
  const changeMeRow = document.getElementById('change-me-row');
  if (changeMeRow) changeMeRow.onclick = () => promptSelectMe(true);

  // member edit form handlers
  if (currentView === 'member-edit') attachMemberEditHandlers();

  // add-round handlers
  if (currentView === 'add-round') attachAddRoundHandlers();
}

function attachMemberEditHandlers() {
  const m = state.members.find(x => x.id === currentEditMemberId);
  if (!m) return;
  const saveBtn = document.getElementById('save-member');
  if (saveBtn) saveBtn.onclick = async () => {
    const name = (document.getElementById('edit-name').value || '').trim();
    const yomi = (document.getElementById('edit-yomi').value || '').trim();
    const aliasesStr = (document.getElementById('edit-aliases').value || '').trim();
    const initial = (document.getElementById('edit-initial').value || '').trim() || name.charAt(0);
    if (!name) { alert('名前を入力してください'); return; }
    const aliases = aliasesStr.split(/[,、,\s]+/).map(s=>s.trim()).filter(Boolean);
    saveBtn.disabled = true;
    try {
      await updateDoc(doc(db, 'members', m.id), { name, yomi, aliases, initial });
      setView('settings');
    } catch(err) {
      alert('保存に失敗しました：' + (err.message || err));
      saveBtn.disabled = false;
    }
  };
  const cancelBtn = document.getElementById('cancel-edit');
  if (cancelBtn) cancelBtn.onclick = () => setView('settings');
  const delBtn = document.getElementById('delete-member');
  if (delBtn) delBtn.onclick = async () => {
    if (state.members.length <= 1) { alert('最低1名は必要です'); return; }
    if (!confirm(`「${m.name}」を削除しますか？\n（このメンバーが参加しているラウンドのスコアは残ります）`)) return;
    try {
      await deleteDoc(doc(db, 'members', m.id));
      setView('settings');
    } catch(err) {
      alert('削除に失敗しました：' + (err.message || err));
    }
  };
}

function attachAddRoundHandlers() {
  const d = draftRound;

  // date
  const dateEl = document.getElementById('draft-date');
  if (dateEl) dateEl.onchange = (e) => { d.date = e.target.value; };

  // weather
  document.querySelectorAll('[data-weather]').forEach(el => {
    el.onclick = () => {
      d.weather = el.dataset.weather;
      document.querySelectorAll('[data-weather]').forEach(x => x.classList.toggle('selected', x.dataset.weather===d.weather));
    };
  });

  // course
  const courseEl = document.getElementById('draft-course');
  if (courseEl) courseEl.oninput = (e) => { d.course = e.target.value; };

  // member toggle
  document.querySelectorAll('[data-member]').forEach(el => {
    el.onclick = () => {
      const mid = el.dataset.member;
      const idx = d.selectedMembers.indexOf(mid);
      if (idx >= 0) {
        if (d.selectedMembers.length === 1) { alert('最低1名は必要です'); return; }
        d.selectedMembers.splice(idx,1);
        delete d.scores[mid];
      } else {
        d.selectedMembers.push(mid);
        d.scores[mid] = { holes: Array(18).fill(0), out: 0, in: 0, total: 0 };
      }
      // re-render only the form
      document.getElementById('main-content').innerHTML = renderAddRound();
      attachHandlers();
    };
  });

  // score-mode radio toggle
  document.querySelectorAll('input[name="score-mode"]').forEach(radio => {
    radio.onchange = (e) => {
      d.outInOnly = (e.target.value === 'outin');
      // re-render to switch table layout
      document.getElementById('main-content').innerHTML = renderAddRound();
      attachHandlers();
    };
  });

  // player swap dropdown (change who a row belongs to, keep scores)
  document.querySelectorAll('.player-swap-select').forEach(sel => {
    sel.onchange = (e) => {
      const oldPid = e.target.dataset.currentPid;
      const newPid = e.target.value;
      if (!newPid || newPid === oldPid) return;
      if (d.selectedMembers.includes(newPid)) {
        alert(`「${memberName(newPid)}」さんは既に参加メンバーに含まれています。\n先にそのメンバーを外してから差し替えてください。`);
        e.target.value = oldPid;
        return;
      }
      // transfer score data
      d.scores[newPid] = d.scores[oldPid];
      delete d.scores[oldPid];
      // update selectedMembers order preservation
      const idx = d.selectedMembers.indexOf(oldPid);
      if (idx >= 0) d.selectedMembers[idx] = newPid;
      // re-render
      document.getElementById('main-content').innerHTML = renderAddRound();
      attachHandlers();
    };
  });

  // hole inputs (detailed mode) and out/in inputs (OUT/IN mode)
  document.querySelectorAll('.hole-input').forEach(input => {
    input.oninput = (e) => {
      const pid = e.target.dataset.player;
      const sc = d.scores[pid] || (d.scores[pid] = { holes: Array(18).fill(0), out: 0, in: 0, total: 0 });
      const field = e.target.dataset.field;
      if (field === 'out' || field === 'in') {
        // OUT/IN-only mode
        sc[field] = parseInt(e.target.value) || 0;
        sc.total = (sc.out || 0) + (sc.in || 0);
      } else {
        // detailed mode
        const hole = parseInt(e.target.dataset.hole);
        sc.holes[hole] = parseInt(e.target.value) || 0;
        sc.out = sc.holes.slice(0,9).reduce((a,b)=>a+b,0);
        sc.in = sc.holes.slice(9,18).reduce((a,b)=>a+b,0);
        sc.total = sc.out + sc.in;
      }
      const outEl = document.querySelector(`[data-out="${pid}"]`);
      const inEl = document.querySelector(`[data-in="${pid}"]`);
      const totalEl = document.querySelector(`[data-total="${pid}"]`);
      if (outEl) outEl.textContent = sc.out || '-';
      if (inEl) inEl.textContent = sc.in || '-';
      if (totalEl) totalEl.textContent = sc.total || '-';
    };
  });

  // photo uploads (Firebase Storage: keep File object, generate preview)
  document.querySelectorAll('[data-photo-input]').forEach(input => {
    input.onchange = (e) => {
      const idx = parseInt(input.dataset.photoInput);
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const previewDataUrl = ev.target.result;
        const caption = prompt('一言キャプション（任意）') || '';
        d.photos[idx] = {
          memberId: state.me,
          file,
          previewDataUrl,
          caption,
          // url/path will be set after upload during save
        };
        document.getElementById('main-content').innerHTML = renderAddRound();
        attachHandlers();
      };
      reader.readAsDataURL(file);
    };
  });
  document.querySelectorAll('[data-remove-photo]').forEach(el => {
    el.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      const idx = parseInt(el.dataset.removePhoto);
      d.photos[idx] = null;
      d.photos = d.photos.filter(p=>p);
      document.getElementById('main-content').innerHTML = renderAddRound();
      attachHandlers();
    };
  });

  // save (Firebase: upload photos to Storage, write doc to Firestore)
  const saveBtn = document.getElementById('save-round');
  if (saveBtn) saveBtn.onclick = async () => {
    if (!d.course.trim()) { alert('コース名を入力してください'); return; }
    if (!d.selectedMembers.length) { alert('参加メンバーを選んでください'); return; }
    saveBtn.disabled = true;
    saveBtn.textContent = '保存中…';

    try {
      const targetRoundId = editingRoundId || crypto.randomUUID().replace(/-/g,'').slice(0,16);
      // Upload new photo files; keep already-uploaded ones as-is
      const finalPhotos = [];
      const filteredPhotos = d.photos.filter(p => p);
      for (let i = 0; i < filteredPhotos.length; i++) {
        const p = filteredPhotos[i];
        if (p.file) {
          const ext = (p.file.name || 'jpg').split('.').pop().toLowerCase().slice(0,4) || 'jpg';
          const path = `rounds/${targetRoundId}/photo_${i}_${Date.now()}.${ext}`;
          const sref = storageRef(storage, path);
          await uploadBytes(sref, p.file);
          const url = await getDownloadURL(sref);
          finalPhotos.push({
            memberId: p.memberId || state.me,
            url, path,
            caption: p.caption || '',
          });
        } else if (p.url) {
          finalPhotos.push({
            memberId: p.memberId, url: p.url, path: p.path || '', caption: p.caption || ''
          });
        }
      }

      const commentText = document.getElementById('draft-comment').value.trim();
      const otherComments = (d.comments || []).filter(c => c.memberId !== state.me);

      const newRound = {
        date: d.date,
        course: d.course.trim(),
        weather: d.weather,
        scores: {},
        photos: finalPhotos,
        comments: otherComments.slice(),
        updatedAt: new Date().toISOString(),
      };
      d.selectedMembers.forEach(mid => {
        const sc = normalizeScore(d.scores[mid] || {});
        newRound.scores[mid] = { holes: sc.holes, out: sc.out, in: sc.in, total: sc.total };
      });
      if (commentText) newRound.comments.push({ memberId: state.me, text: commentText });

      if (!editingRoundId) newRound.createdAt = new Date().toISOString();

      await setDoc(doc(db, 'rounds', targetRoundId), newRound);

      const wasEditing = !!editingRoundId;
      draftRound = null; editingRoundId = null;
      if (wasEditing) setView('detail', { detailId: targetRoundId });
      else setView('timeline');
    } catch(err) {
      console.error(err);
      alert('保存に失敗しました：' + (err.message || err));
      saveBtn.disabled = false;
      saveBtn.textContent = editingRoundId ? '更新する' : '記録する';
    }
  };

  const cancelBtn = document.getElementById('cancel-add');
  if (cancelBtn) cancelBtn.onclick = () => {
    if (confirm('入力内容を破棄しますか？')) {
      const wasEditing = editingRoundId;
      draftRound = null; editingRoundId = null;
      if (wasEditing) { setView('detail', { detailId: wasEditing }); }
      else { setView('timeline'); }
    }
  };

  // OCR trigger
  const ocrBtn = document.getElementById('ocr-trigger');
  if (ocrBtn) ocrBtn.onclick = () => startMockOcrFlow();
}

/* =========================================================
   OCR MOCK FLOW
   ========================================================= */
let ocrResult = null;
let ocrAssignments = null; // [{ rawName, memberId, scores, isNewMember }]

function startMockOcrFlow() {
  // If Worker URL is configured, use real Claude API; otherwise fall back to mock
  if (OCR_WORKER_URL) {
    pickPhotoAndCallWorker();
  } else {
    // Mock mode: skip file picker, show fake recognition
    showOcrProgress(true);
  }
}

function pickPhotoAndCallWorker() {
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.style.display = 'none';
  document.body.appendChild(fileInput);
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    document.body.removeChild(fileInput);
    if (!file) return;
    showOcrProgress(false);
    try {
      const base64 = await fileToBase64(file);
      const resp = await fetch(OCR_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          imageBase64: base64,
          mediaType: file.type || 'image/jpeg',
        }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(()=>({}));
        throw new Error(err.error || `HTTP ${resp.status}`);
      }
      const data = await resp.json();
      processOcrResult(data);
    } catch (err) {
      console.error('OCR error', err);
      closeOcrOverlay();
      alert('スコアカードの読み取りに失敗しました：' + (err.message || err) + '\n\n手入力でお試しください。');
    }
  };
  fileInput.click();
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      // Strip "data:image/jpeg;base64," prefix
      const base64 = result.split(',')[1] || result;
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showOcrProgress(useMock) {
  closeOcrOverlay();
  const overlay = document.createElement('div');
  overlay.className = 'ocr-overlay';
  overlay.id = 'ocr-overlay';
  overlay.innerHTML = `
    <div class="ocr-modal">
      <div class="ocr-progress">
        <div class="ocr-spinner"></div>
        <div style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">AIがスコアカードを解析中…</div>
        <div style="font-size: 12px; color: var(--text-secondary);">${useMock ? '（モックデータで動作確認中）' : '名前と打数を認識しています'}</div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  if (useMock) {
    setTimeout(() => processOcrResult(mockOcrRecognition()), 1400);
  }
}

function processOcrResult(data) {
  ocrResult = data;
  ocrAssignments = (data.players || []).map(p => {
    const match = matchMember(p.rawName, state.members);
    const scores = Array.isArray(p.scores) ? p.scores.slice(0,18) : Array(18).fill(0);
    while (scores.length < 18) scores.push(0);
    const out = Number(p.out) || scores.slice(0,9).reduce((a,b)=>a+b,0);
    const inS = Number(p.in) || scores.slice(9,18).reduce((a,b)=>a+b,0);
    const total = Number(p.total) || (out + inS);
    return {
      rawName: p.rawName,
      scores,
      out, in: inS, total,
      memberId: match.member ? match.member.id : '',
      reason: match.reason,
      confidence: match.confidence || 'none',
      isNewMember: false,
      newMemberName: '',
    };
  });
  showOcrReview();
}

function showOcrReview() {
  closeOcrOverlay();
  const overlay = document.createElement('div');
  overlay.className = 'ocr-overlay';
  overlay.id = 'ocr-overlay';

  const playerRows = ocrAssignments.map((a, idx) => {
    const confClass = a.confidence === 'high' ? 'high' : (a.confidence === 'low' ? 'low' : 'none');
    const anyHole = (a.scores || []).some(h => Number(h) > 0);
    const scoresPreview = anyHole
      ? `OUT ${a.scores.slice(0,9).map(v=>v||'-').join(' ')} = ${a.out||0}<br>IN ${a.scores.slice(9).map(v=>v||'-').join(' ')} = ${a.in||0}<br>合計 <b style="color: var(--primary-dark);">${a.total||0}</b>`
      : `<span style="background:var(--accent-bg, #FFF4DC); padding:2px 6px; border-radius:4px; margin-right:4px; font-size:10px;">OUT/IN合計のみ</span>OUT ${a.out||0} / IN ${a.in||0} / 合計 <b style="color: var(--primary-dark);">${a.total||0}</b>`;

    const memberOptions = state.members.map(m =>
      `<option value="${m.id}" ${m.id===a.memberId?'selected':''}>${m.name}</option>`
    ).join('');

    return `
      <div class="ocr-result-row">
        <div class="ocr-raw-name">${a.rawName}</div>
        <div>
          <select class="form-select" data-ocr-idx="${idx}" style="margin-bottom: 4px;">
            <option value="" ${!a.memberId && !a.isNewMember?'selected':''}>— 選択してください —</option>
            ${memberOptions}
            <option value="__new__" ${a.isNewMember?'selected':''}>+ 新しいメンバーとして登録</option>
          </select>
          ${a.isNewMember ? `<input class="form-input" type="text" data-ocr-newname="${idx}" placeholder="新メンバーの名前" value="${a.newMemberName||a.rawName}" style="margin-bottom: 4px;">` : ''}
          <div class="ocr-match-info ${confClass}">
            ${a.memberId ? `✓ ${a.reason}` : (a.isNewMember ? '＋ 新規登録予定' : '? 未マッチ - 選択するか新規登録してください')}
          </div>
          <div class="ocr-scores-preview">${scoresPreview}</div>
        </div>
      </div>
    `;
  }).join('');

  overlay.innerHTML = `
    <div class="ocr-modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px;">
        <div>
          <div style="font-size: 16px; font-weight: 600;">AIが読み取りました</div>
          <div style="font-size: 12px; color: var(--text-secondary);">名前のマッチングを確認してください</div>
        </div>
        <button class="btn btn-ghost" id="ocr-close" style="padding: 6px 10px; font-size: 18px;">×</button>
      </div>

      <div style="background: var(--surface-2); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 12px; font-size: 12px;">
        <div><b>コース：</b>${ocrResult.course}</div>
        <div><b>日付：</b>${ocrResult.date}　<b>天気：</b>${ocrResult.weather}</div>
      </div>

      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 16px;">
        ${playerRows}
      </div>

      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" id="ocr-cancel" style="flex:1;">キャンセル</button>
        <button class="btn" id="ocr-apply" style="flex:2;">適用してフォームに反映</button>
      </div>

      <div class="help-text" style="margin-top: 10px;">
        ${OCR_WORKER_URL ? '※ Claude AIがスコアカード写真から読み取った内容です。誤読がある場合はドロップダウンや手入力で修正してください。' : '※ デモモード（モックデータ）：実際の写真は使われていません。Worker URLを設定すると実写真の読み取りができます。'}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  // close handlers
  document.getElementById('ocr-close').onclick = closeOcrOverlay;
  document.getElementById('ocr-cancel').onclick = closeOcrOverlay;

  // change member selection
  overlay.querySelectorAll('[data-ocr-idx]').forEach(sel => {
    sel.onchange = (e) => {
      const idx = parseInt(e.target.dataset.ocrIdx);
      const v = e.target.value;
      if (v === '__new__') {
        ocrAssignments[idx].isNewMember = true;
        ocrAssignments[idx].memberId = '';
        ocrAssignments[idx].newMemberName = ocrAssignments[idx].rawName;
      } else {
        ocrAssignments[idx].isNewMember = false;
        ocrAssignments[idx].memberId = v;
        ocrAssignments[idx].reason = v ? '手動選択' : '未選択';
        ocrAssignments[idx].confidence = v ? 'high' : 'none';
      }
      showOcrReview(); // re-render
    };
  });
  overlay.querySelectorAll('[data-ocr-newname]').forEach(inp => {
    inp.oninput = (e) => {
      const idx = parseInt(e.target.dataset.ocrNewname);
      ocrAssignments[idx].newMemberName = e.target.value;
    };
  });

  // apply
  document.getElementById('ocr-apply').onclick = () => applyOcrToDraft();
}

async function applyOcrToDraft() {
  // validate
  for (const a of ocrAssignments) {
    if (!a.memberId && !a.isNewMember) {
      alert(`「${a.rawName}」のメンバーを選んでください`);
      return;
    }
    if (a.isNewMember && !(a.newMemberName||'').trim()) {
      alert(`「${a.rawName}」に対応する新メンバーの名前を入力してください`);
      return;
    }
  }
  const applyBtn = document.getElementById('ocr-apply');
  if (applyBtn) { applyBtn.disabled = true; applyBtn.textContent = '登録中…'; }
  try {
    // register new members in Firestore
    for (const a of ocrAssignments) {
      if (a.isNewMember) {
        const nm = a.newMemberName.trim();
        const ref = await addDoc(collection(db, 'members'), {
          name: nm, initial: nm.charAt(0), yomi: '', aliases: [a.rawName]
        });
        a.memberId = ref.id;
      }
    }

    // apply to draftRound
    if (!draftRound) initDraft();
    draftRound.course = ocrResult.course || draftRound.course;
    draftRound.weather = ocrResult.weather || draftRound.weather;
    draftRound.date = ocrResult.date || draftRound.date;
    draftRound.selectedMembers = ocrAssignments.map(a => a.memberId);
    draftRound.scores = {};
    ocrAssignments.forEach(a => {
      draftRound.scores[a.memberId] = {
        holes: a.scores.slice(),
        out: a.out || 0,
        in: a.in || 0,
        total: a.total || 0,
      };
    });
    // Auto-detect OUT/IN-only mode if all detected scores have no hole detail
    const allOutInOnly = ocrAssignments.length > 0 && ocrAssignments.every(a => {
      const anyHole = (a.scores || []).some(h => Number(h) > 0);
      const hasOutIn = (a.out > 0 || a.in > 0 || a.total > 0);
      return !anyHole && hasOutIn;
    });
    draftRound.outInOnly = allOutInOnly;

    closeOcrOverlay();
    document.getElementById('main-content').innerHTML = renderAddRound();
    attachHandlers();
  } catch(err) {
    alert('適用に失敗しました：' + (err.message || err));
    if (applyBtn) { applyBtn.disabled = false; applyBtn.textContent = '適用してフォームに反映'; }
  }
}

function closeOcrOverlay() {
  const ov = document.getElementById('ocr-overlay');
  if (ov) ov.remove();
}

/* =========================================================
   LIGHTBOX (photo zoom)
   ========================================================= */
let lightboxState = { photos: [], currentIdx: 0 };

function openLightbox(photos, idx) {
  // Filter to only photos with usable URLs
  const usable = (photos || []).filter(p => p && (p.url || p.dataUrl));
  if (!usable.length) return;
  lightboxState.photos = usable;
  lightboxState.currentIdx = Math.max(0, Math.min(idx || 0, usable.length - 1));
  renderLightbox();
}

function renderLightbox() {
  closeLightbox(false);
  const { photos, currentIdx } = lightboxState;
  const p = photos[currentIdx];
  if (!p) return;
  const url = p.url || p.dataUrl;
  const showNav = photos.length > 1;
  const captionParts = [];
  if (p.memberId) captionParts.push(memberInitial(p.memberId) + 'さんの一枚');
  if (p.caption) captionParts.push(p.caption);
  if (showNav) captionParts.push(`${currentIdx+1} / ${photos.length}`);
  const captionText = captionParts.join(' ・ ');

  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.id = 'lightbox-overlay';
  overlay.innerHTML = `
    <button class="lightbox-close" id="lb-close" aria-label="閉じる">×</button>
    ${showNav ? `<button class="lightbox-nav lightbox-prev" id="lb-prev" aria-label="前へ">‹</button>` : ''}
    <img class="lightbox-img" src="${url}" alt="">
    ${showNav ? `<button class="lightbox-nav lightbox-next" id="lb-next" aria-label="次へ">›</button>` : ''}
    ${captionText ? `<div class="lightbox-caption">${captionText}</div>` : ''}
  `;
  document.body.appendChild(overlay);

  overlay.onclick = (e) => {
    // Click on the dark area (not the image or buttons) closes the lightbox
    if (e.target === overlay) closeLightbox();
  };
  document.getElementById('lb-close').onclick = (e) => { e.stopPropagation(); closeLightbox(); };
  if (showNav) {
    document.getElementById('lb-prev').onclick = (e) => {
      e.stopPropagation();
      lightboxState.currentIdx = (lightboxState.currentIdx - 1 + photos.length) % photos.length;
      renderLightbox();
    };
    document.getElementById('lb-next').onclick = (e) => {
      e.stopPropagation();
      lightboxState.currentIdx = (lightboxState.currentIdx + 1) % photos.length;
      renderLightbox();
    };
  }

  // Prevent image click from closing
  overlay.querySelector('img').onclick = (e) => e.stopPropagation();

  document.addEventListener('keydown', lightboxKeyHandler);
}

function closeLightbox(removeListener = true) {
  const ov = document.getElementById('lightbox-overlay');
  if (ov) ov.remove();
  if (removeListener) document.removeEventListener('keydown', lightboxKeyHandler);
}

function lightboxKeyHandler(e) {
  const photos = lightboxState.photos;
  if (e.key === 'Escape') { closeLightbox(); }
  else if (e.key === 'ArrowLeft' && photos.length > 1) {
    lightboxState.currentIdx = (lightboxState.currentIdx - 1 + photos.length) % photos.length;
    renderLightbox();
  } else if (e.key === 'ArrowRight' && photos.length > 1) {
    lightboxState.currentIdx = (lightboxState.currentIdx + 1) % photos.length;
    renderLightbox();
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `golf_data_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

/* =========================================================
   NAV / FAB / LOGIN
   ========================================================= */
document.querySelectorAll('.nav-item').forEach(b => {
  b.onclick = () => setView(b.dataset.view);
});
document.getElementById('fab-add').onclick = () => {
  draftRound = null;
  setView('add-round');
};

// Screen management - shows app if signed in AND session flag is set
async function showAppScreen() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  try { await maybeSeedInitialData(); } catch(e) { console.error('seed error', e); }
  if (!membersUnsub) startListeners();
}
function showLoginScreen() {
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}

// Login - check password locally, then signInAnonymously
async function tryLogin() {
  const input = document.getElementById('login-input');
  const err = document.getElementById('login-error');
  if (input.value !== PASSWORD) {
    err.style.color = '#C0392B';
    err.textContent = '合い言葉が違います';
    input.value = '';
    return;
  }
  err.style.color = 'var(--text-secondary)';
  err.textContent = 'ログイン中…';
  try {
    if (!auth.currentUser) {
      await signInAnonymously(auth);
    }
    sessionStorage.setItem(SESSION_KEY, '1');
    await showAppScreen();
  } catch(e) {
    err.style.color = '#C0392B';
    err.textContent = 'ログインエラー：' + (e.message || e);
  }
}
document.getElementById('login-btn').onclick = tryLogin;
document.getElementById('login-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryLogin();
});

/* =========================================================
   INIT
   ========================================================= */
loadPrefs();
applyTheme(state.theme || 'E');

onAuthStateChanged(auth, async (user) => {
  const sessionOK = sessionStorage.getItem(SESSION_KEY) === '1';
  if (user && sessionOK) {
    await showAppScreen();
  } else {
    showLoginScreen();
  }
});

// Auto-restore: if we have the session flag from a previous load in this tab,
// silently sign in (Firebase Auth state may have been cleared)
if (sessionStorage.getItem(SESSION_KEY) === '1' && !auth.currentUser) {
  signInAnonymously(auth).catch(e => {
    console.error('auto auth failed', e);
    sessionStorage.removeItem(SESSION_KEY);
  });
}

function init() {
  applyTheme(state.theme || 'E');
  const ha = document.getElementById('header-avatar');
  if (ha) ha.textContent = state.me ? memberInitial(state.me) : '?';
  render();
}
