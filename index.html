<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>後継者研修ゴルフ</title>
<style>
/* =========================================================
   THEME SYSTEM - 5 patterns via CSS variables
   ========================================================= */
:root,
[data-theme="E"] {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --surface-2: #F5F5F2;
  --primary: #1D9E75;
  --primary-dark: #0F6E56;
  --primary-light: #C0DD97;
  --primary-bg: #EAF3DE;
  --accent: #EF9F27;
  --accent-dark: #BA7517;
  --text: #1A1A1A;
  --text-secondary: #555555;
  --text-muted: #888888;
  --border: #E5E5E5;
  --border-strong: #CCCCCC;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-display: var(--font);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-strong: 0 4px 12px rgba(0,0,0,0.08);
  --header-style: pop;
}
[data-theme="A"] {
  --bg: #F4F8EE;
  --surface: #FFFFFF;
  --surface-2: #EAF0DE;
  --primary: #3B6D11;
  --primary-dark: #173404;
  --primary-light: #C0DD97;
  --primary-bg: #EAF3DE;
  --accent: #B8945F;
  --accent-dark: #8B6E3F;
  --text: #173404;
  --text-secondary: #4A5A3A;
  --text-muted: #7A8A6A;
  --border: #D5DCC8;
  --border-strong: #B5BCA8;
  --radius-sm: 2px;
  --radius-md: 3px;
  --radius-lg: 4px;
  --radius-pill: 4px;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-display: Georgia, "Yu Mincho", serif;
  --shadow: none;
  --shadow-strong: 0 2px 6px rgba(0,0,0,0.08);
  --header-style: classic;
}
[data-theme="B"] {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F7F7F7;
  --primary: #111111;
  --primary-dark: #000000;
  --primary-light: #EAEAEA;
  --primary-bg: #F5F5F5;
  --accent: #666666;
  --accent-dark: #333333;
  --text: #111111;
  --text-secondary: #666666;
  --text-muted: #999999;
  --border: #EDEDED;
  --border-strong: #D5D5D5;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-pill: 999px;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-display: var(--font);
  --shadow: none;
  --shadow-strong: 0 0 0 0.5px rgba(0,0,0,0.08);
  --header-style: minimal;
}
[data-theme="C"] {
  --bg: #0C2340;
  --surface: #1A3554;
  --surface-2: #143049;
  --primary: #B8945F;
  --primary-dark: #8B6E3F;
  --primary-light: #D8C9A6;
  --primary-bg: #2A4A6A;
  --accent: #F5EFE0;
  --accent-dark: #D8C9A6;
  --text: #F5EFE0;
  --text-secondary: #D8C9A6;
  --text-muted: #8FA0B0;
  --border: #2A4A6A;
  --border-strong: #3A5A7A;
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-pill: 999px;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-display: Georgia, "Yu Mincho", serif;
  --shadow: none;
  --shadow-strong: 0 4px 16px rgba(0,0,0,0.3);
  --header-style: premium;
}
[data-theme="D"] {
  --bg: #FAF7F0;
  --surface: #FFFFFF;
  --surface-2: #F0EBD9;
  --primary: #8B1A1A;
  --primary-dark: #5A0F0F;
  --primary-light: #E8B0B0;
  --primary-bg: #F5E0E0;
  --accent: #1A4A2A;
  --accent-dark: #0F3520;
  --text: #1A1A1A;
  --text-secondary: #4A4A4A;
  --text-muted: #7A7A7A;
  --border: #E8DFC8;
  --border-strong: #C8BFA8;
  --radius-sm: 0px;
  --radius-md: 2px;
  --radius-lg: 3px;
  --radius-pill: 0px;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-display: "Yu Mincho", "Hiragino Mincho ProN", serif;
  --shadow: none;
  --shadow-strong: 0 2px 8px rgba(0,0,0,0.06);
  --header-style: wa;
}

/* =========================================================
   GLOBAL
   ========================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--primary); text-decoration: none; }

/* =========================================================
   APP LAYOUT
   ========================================================= */
#app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  padding-bottom: 120px;
  position: relative;
}

/* HEADER */
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
}
[data-theme="C"] .app-header { background: var(--surface); border-bottom-color: var(--accent-dark); }
[data-theme="D"] .app-header { border-top: 3px solid var(--primary); }

.app-title {
  font-family: var(--font-display);
  font-size: 17px; font-weight: 600;
  color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.app-title-icon {
  width: 28px; height: 28px;
  background: var(--primary); color: white;
  border-radius: var(--radius-pill);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
}
[data-theme="C"] .app-title-icon { background: var(--primary); color: var(--bg); }

.app-user {
  font-size: 13px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px;
}
.user-avatar {
  width: 30px; height: 30px;
  background: var(--primary-bg); color: var(--primary-dark);
  border-radius: var(--radius-pill);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
}
[data-theme="C"] .user-avatar { background: var(--primary-bg); color: var(--primary); }

/* MAIN */
.app-main { padding: 18px; }

/* VIEW TRANSITION */
.view { animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* SECTION HEADING */
.section-heading {
  font-size: 13px; font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 1.5px;
  margin: 24px 0 12px;
  display: flex; align-items: center; justify-content: space-between;
}
[data-theme="D"] .section-heading { font-family: var(--font-display); letter-spacing: 2px; }

/* =========================================================
   ROUND CARD (Timeline)
   ========================================================= */
.round-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.round-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-strong); }
[data-theme="A"] .round-card { border-left: 4px solid var(--primary); border-radius: 0; }
[data-theme="C"] .round-card { background: var(--surface); border-color: var(--primary); border-top: 0.5px solid var(--primary); border-bottom: 0.5px solid var(--primary); }
[data-theme="D"] .round-card { border-top: 3px solid var(--primary); border-radius: 0; }
[data-theme="E"] .round-card { border: 2px solid var(--primary); }

.round-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.round-meta { flex: 1; }
.round-tags { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.tag {
  font-size: 11px; padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: var(--primary-bg); color: var(--primary-dark);
  font-weight: 500;
}
.tag-accent { background: var(--accent); color: white; }
[data-theme="C"] .tag { background: var(--primary-bg); color: var(--primary); }
[data-theme="C"] .tag-accent { background: var(--accent); color: var(--bg); }
[data-theme="B"] .tag { background: var(--surface-2); color: var(--text); border: 0.5px solid var(--border); }
[data-theme="D"] .tag { background: var(--surface-2); color: var(--text); border-radius: 0; }

.round-course {
  font-family: var(--font-display);
  font-size: 17px; font-weight: 600;
  color: var(--text);
  margin-top: 2px;
}
.round-best {
  background: var(--primary-bg);
  border-radius: var(--radius-md);
  padding: 6px 12px;
  text-align: center;
  min-width: 64px;
}
.round-best-label { font-size: 10px; color: var(--primary-dark); text-transform: uppercase; letter-spacing: 1px; }
.round-best-score { font-size: 20px; font-weight: 600; color: var(--primary-dark); line-height: 1.1; }
[data-theme="C"] .round-best { background: var(--primary-bg); }
[data-theme="C"] .round-best-label, [data-theme="C"] .round-best-score { color: var(--primary); }

.round-body { display: grid; grid-template-columns: 1fr 110px; gap: 12px; }
.round-scores { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
.round-scores .crown { color: var(--accent); font-weight: 600; }
.round-photo {
  height: 80px;
  background: var(--surface-2);
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text-muted);
  background-size: cover; background-position: center;
  border: 1px solid var(--border);
}
.round-photo.empty { background: var(--surface-2); }

/* =========================================================
   RANKING VIEW
   ========================================================= */
.kpi-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; margin-bottom: 18px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
}
.kpi-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
.kpi-value { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--primary-dark); margin-top: 4px; }
[data-theme="C"] .kpi-value { color: var(--primary); }

.ranking-table {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.ranking-row {
  display: grid; grid-template-columns: 62px 1fr 60px 60px;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  min-height: 64px;
}
.ranking-row:last-child { border-bottom: none; }
.ranking-row.header {
  background: var(--surface-2);
  font-size: 11px; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 1px;
  font-weight: 600;
  min-height: auto;
  padding: 10px 14px;
}
.ranking-row.top-1 { background: linear-gradient(90deg, rgba(241,196,15,0.12), transparent 50%); }
.ranking-row.top-2 { background: linear-gradient(90deg, rgba(160,170,180,0.14), transparent 50%); }
.ranking-row.top-3 { background: linear-gradient(90deg, rgba(205,127,50,0.12), transparent 50%); }
[data-theme="C"] .ranking-row.top-1 { background: linear-gradient(90deg, rgba(241,196,15,0.18), transparent 50%); }
[data-theme="C"] .ranking-row.top-2 { background: linear-gradient(90deg, rgba(200,210,220,0.15), transparent 50%); }
[data-theme="C"] .ranking-row.top-3 { background: linear-gradient(90deg, rgba(230,140,60,0.18), transparent 50%); }

.rank-num {
  font-family: var(--font-display);
  font-weight: 700; font-size: 18px;
  color: var(--text-muted);
  text-align: center;
}
.medal-svg { display: block; width: 56px; height: 50px; }
.rank-num-plain {
  width: 56px; height: 50px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-weight: 700; font-size: 18px;
  color: var(--text-muted);
}
.rank-name { display: flex; align-items: center; gap: 8px; }
.rank-name .user-avatar { width: 26px; height: 26px; font-size: 11px; }
.rank-score { text-align: right; font-weight: 600; color: var(--text); }
.rank-rounds { text-align: right; color: var(--text-secondary); font-size: 13px; }

/* =========================================================
   FORM
   ========================================================= */
.form-section { margin-bottom: 20px; }
.form-label {
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 1px;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  font-size: 15px;
  color: var(--text);
  transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none; border-color: var(--primary);
}
.form-textarea { resize: vertical; min-height: 64px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.weather-row { display: flex; gap: 6px; flex-wrap: wrap; }
.weather-chip {
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-pill);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.weather-chip.selected {
  background: var(--primary); color: white;
  border-color: var(--primary);
}
[data-theme="C"] .weather-chip.selected { background: var(--primary); color: var(--bg); }

.member-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
}
.member-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.member-chip.selected {
  background: var(--primary-bg);
  border-color: var(--primary);
  color: var(--primary-dark);
}
[data-theme="C"] .member-chip.selected { color: var(--primary); }
.member-chip .check {
  width: 18px; height: 18px;
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
}
.member-chip.selected .check { background: var(--primary); color: white; }

/* Scorecard table */
.scorecard-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.scorecard {
  border-collapse: collapse;
  width: 100%; min-width: 720px;
  font-size: 13px;
  background: var(--surface);
  border-radius: var(--radius-md);
}
/* Compact mode for OUT/IN-only scorecards - fits on mobile without scrolling */
.scorecard.scorecard-compact {
  min-width: 100%;
  table-layout: fixed;
}
.scorecard.scorecard-compact td:first-child,
.scorecard.scorecard-compact th:first-child {
  min-width: 0;
  width: 38%;
  position: static;
}
.scorecard.scorecard-compact th:not(:first-child),
.scorecard.scorecard-compact td:not(:first-child) {
  width: 20.5%;
}
.scorecard.scorecard-compact select.player-swap-select {
  min-width: 0;
  width: 100%;
  font-size: 12px;
  padding: 4px 2px;
}
.scorecard.scorecard-compact input.hole-input {
  width: 100%;
  max-width: 56px;
}
.scorecard th, .scorecard td {
  border: 1px solid var(--border);
  padding: 6px 4px;
  text-align: center;
}
.scorecard th {
  background: var(--surface-2);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  position: sticky; top: 0;
}
.scorecard td:first-child, .scorecard th:first-child {
  position: sticky; left: 0;
  background: var(--surface);
  z-index: 2;
  text-align: left;
  padding-left: 8px;
  min-width: 90px;
  font-weight: 500;
}
.scorecard th:first-child { background: var(--surface-2); }
.scorecard input.hole-input {
  width: 38px;
  border: none;
  background: transparent;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  padding: 4px 2px;
}
.scorecard select.player-swap-select {
  width: 100%;
  min-width: 88px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}
.scorecard select.player-swap-select:hover { border-color: var(--primary); }
.scorecard select.player-swap-select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.scorecard input.hole-input:focus {
  outline: 2px solid var(--primary);
  border-radius: 4px;
  background: var(--primary-bg);
}
.scorecard td.total-cell {
  background: var(--primary-bg);
  font-weight: 700;
  color: var(--primary-dark);
}
[data-theme="C"] .scorecard td.total-cell { color: var(--primary); }

/* Photo upload */
.photo-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.photo-upload {
  aspect-ratio: 1;
  background: var(--surface-2);
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-md);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 12px; color: var(--text-muted);
  position: relative;
  overflow: hidden;
  background-size: cover; background-position: center;
}
.photo-upload.has-image { border-style: solid; border-color: var(--primary); }
.photo-upload input[type="file"] { display: none; }
.photo-upload .photo-icon { font-size: 28px; margin-bottom: 4px; opacity: 0.5; }
.photo-upload .photo-remove {
  position: absolute; top: 4px; right: 4px;
  background: rgba(0,0,0,0.6); color: white;
  width: 22px; height: 22px;
  border-radius: var(--radius-pill);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1;
}

/* =========================================================
   BUTTONS
   ========================================================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px;
  background: var(--primary); color: white;
  border-radius: var(--radius-pill);
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  border: none;
}
.btn:hover { opacity: 0.9; }
.btn:active { transform: scale(0.98); }
.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-strong);
}
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-full { width: 100%; padding: 12px 18px; }
[data-theme="C"] .btn { color: var(--bg); }

/* FAB */
.fab {
  position: fixed; bottom: 84px;
  right: max(20px, calc(50vw - 340px));
  width: 56px; height: 56px;
  background: var(--primary); color: white;
  border-radius: var(--radius-pill);
  font-size: 28px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-strong);
  z-index: 40;
}
[data-theme="C"] .fab { color: var(--bg); }
[data-theme="B"] .fab { background: var(--text); color: var(--surface); }

/* =========================================================
   BOTTOM NAV
   ========================================================= */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around;
  padding: 8px 0 12px;
  z-index: 30;
  max-width: 720px; margin: 0 auto;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 14px;
  font-size: 11px; color: var(--text-muted);
  border-radius: var(--radius-md);
  background: transparent;
}
.nav-item .nav-icon { font-size: 20px; line-height: 1; }
.nav-item.active { color: var(--primary); }
.nav-item.active .nav-icon { transform: scale(1.05); }

/* =========================================================
   ROUND DETAIL
   ========================================================= */
.detail-hero {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 18px;
  border: 1px solid var(--border);
}
[data-theme="E"] .detail-hero { border: 2px solid var(--primary); }
[data-theme="D"] .detail-hero { border-top: 3px solid var(--primary); border-radius: 0; }
[data-theme="A"] .detail-hero { border-left: 4px solid var(--primary); border-radius: 0; }

.detail-photos {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px; margin-bottom: 18px;
}
.detail-photo {
  aspect-ratio: 1;
  border-radius: var(--radius-md);
  background-size: cover; background-position: center;

/* =========================================================

const PREFS_KEY = 'golf_prefs_v2';

let state = {

function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p.me) state.me = p.me;
      if (p.theme) state.theme = p.theme;
    }
  } catch(e) {}
}
function savePrefs() {
  localStorage.setItem(PREFS_KEY, JSON.stringify({ me: state.me, theme: state.theme }));
}

/* Seed Firestore with sample members on first run (when empty) */
async function maybeSeedInitialData() {
  const snap = await getDocs(collection(db, 'members'));
  if (!snap.empty) return false;
  const seeds = [
    { name: '関口 圭太', initial: '関', yomi: 'せきぐちけいた', aliases: ['関口','関','セキ','ケータ'] },
    { name: '田中 健一', initial: '田', yomi: 'たなかけんいち', aliases: ['田中','タナカ','ケンイチ'] },
    { name: '佐藤 翔太', initial: '佐', yomi: 'さとうしょうた', aliases: ['佐藤','サトウ','ショウタ'] },
    { name: '鈴木 大介', initial: '鈴', yomi: 'すずきだいすけ', aliases: ['鈴木','スズキ','ダイスケ'] },
    { name: '山田 雄一', initial: '山', yomi: 'やまだゆういち', aliases: ['山田','ヤマダ'] },
    { name: '高橋 翼',   initial: '高', yomi: 'たかはしつばさ', aliases: ['高橋','タカハシ','ツバサ'] },
  ];
  for (const m of seeds) {
    await addDoc(collection(db, 'members'), m);
  }
  return true;
}

/* Start realtime listeners on Firestore collections */
function startListeners() {
  if (membersUnsub) membersUnsub();
  if (roundsUnsub) roundsUnsub();
  membersUnsub = onSnapshot(collection(db, 'members'), (snap) => {
    state.members = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    afterDataChange();
  }, (err) => console.error('members listener error', err));
  roundsUnsub = onSnapshot(collection(db, 'rounds'), (snap) => {
    state.rounds = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    afterDataChange();
  }, (err) => console.error('rounds listener error', err));
}

function afterDataChange() {
  dataReady = true;
  // First run: if user has not picked themselves, prompt
  if (state.members.length > 0 && !state.me && !mePromptShown) {
    mePromptShown = true;
    promptSelectMe();
    return;
  }
  // If state.me points to a deleted member, reset
  if (state.me && !state.members.find(m => m.id === state.me)) {
    state.me = null;
    savePrefs();
    if (state.members.length > 0 && !mePromptShown) {
      mePromptShown = true;
      promptSelectMe();
      return;
    }
  }
  // Update header avatar
  const headerAvatar = document.getElementById('header-avatar');
  if (headerAvatar) headerAvatar.textContent = state.me ? memberInitial(state.me) : '?';
  render();
}

function promptSelectMe(allowCancel = false) {
  closeOcrOverlay();
  const overlay = document.createElement('div');
  overlay.className = 'ocr-overlay';
  overlay.id = 'ocr-overlay';
  const isChange = allowCancel && !!state.me;
  overlay.innerHTML = `
    <div class="ocr-modal" style="max-height:80vh;">
      <h3 style="margin-bottom: 6px; font-size: 17px;">${isChange ? '自分のアカウントを切替' : 'あなたは誰ですか？'}</h3>
      <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 16px;">
        ${isChange
          ? `現在のアカウント：<b>${memberName(state.me)}</b><br>切り替えたいメンバーを選んでください。`
          : 'スコア入力で「自分のコメント」「自分の参加デフォルト」を設定するため、まずあなた自身を選んでください。'}
      </p>
      <div style="max-height: 50vh; overflow-y: auto; margin-bottom: 12px;">
        ${state.members.map(m => `
          <button class="btn btn-secondary" data-me-id="${m.id}" style="width:100%; margin-bottom:6px; justify-content:flex-start; padding: 12px 14px; ${m.id===state.me?'border-color: var(--primary); background: var(--primary-bg);':''}">
            <span class="user-avatar" style="width:30px; height:30px; font-size:12px; margin-right:10px;">${m.initial}</span>
            ${m.name}${m.yomi?` <span style="color:var(--text-muted); font-size:11px; margin-left:6px;">${m.yomi}</span>`:''}
            ${m.id===state.me?'<span style="margin-left:auto; font-size:11px; color: var(--primary-dark);">現在</span>':''}
          </button>
        `).join('')}
      </div>
      <button class="btn btn-ghost" id="add-me-new" style="width:100%;">＋ 新規メンバーとして自分を追加</button>
      ${allowCancel ? `<button class="btn btn-ghost" id="prompt-cancel" style="width:100%; margin-top:6px; color: var(--text-secondary);">キャンセル</button>` : ''}
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-me-id]').forEach(b => {
    b.onclick = () => {
      state.me = b.dataset.meId;
      savePrefs();
      overlay.remove();
      afterDataChange();
    };
  });
  document.getElementById('add-me-new').onclick = async () => {
    const name = prompt('あなたの名前を入力してください');
    if (!name || !name.trim()) return;

      name: name.trim(), initial, yomi: '', aliases: []

  };

    document.getElementById('prompt-cancel').onclick = () => overlay.remove();

}

/* =========================================================
   HELPERS
   ========================================================= */
function fmtDate(iso) {
  const d = new Date(iso);
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]})`;
}
function fmtDateShort(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function memberName(id) { return (state.members.find(m=>m.id===id) || {name:'?'}).name; }
function memberInitial(id) { return (state.members.find(m=>m.id===id) || {initial:'?'}).initial; }
function roundParticipants(round) { return Object.keys(round.scores); }

// Normalize a score record: ensure holes (18), out, in, total are all consistent
function normalizeScore(s) {
  const holes = Array.isArray(s.holes) ? s.holes.slice(0,18).map(n => Number(n)||0) : Array(18).fill(0);
  while (holes.length < 18) holes.push(0);
  const computedOut = holes.slice(0,9).reduce((a,b)=>a+b,0);
  const computedIn = holes.slice(9,18).reduce((a,b)=>a+b,0);
  const out = (s.out !== undefined && s.out !== null && s.out !== 0) ? Number(s.out) : computedOut;
  const inS = (s.in !== undefined && s.in !== null && s.in !== 0) ? Number(s.in) : computedIn;
  const total = (s.total !== undefined && s.total !== null && s.total !== 0) ? Number(s.total) : (out + inS);
  return { holes, out, in: inS, total };
}

// Check whether a score record is in "OUT/IN totals only" mode
function isOutInOnly(s) {
  if (!s || !Array.isArray(s.holes)) return false;
  const anyHole = s.holes.some(h => Number(h) > 0);
  const hasOutIn = (s.out > 0 || s.in > 0 || s.total > 0);
  return !anyHole && hasOutIn;
}

function bestOfRound(round) {
  // returns array of tied best entries: [[pid, scoreObj], ...]
  const scores = Object.entries(round.scores);
  if (!scores.length) return [];
  const min = Math.min(...scores.map(([,s]) => s.total));
  return scores.filter(([,s]) => s.total === min);
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  state.theme = t;
  savePrefs();
}

// Katakana -> Hiragana, lowercase, strip whitespace
function normalizeName(s) {
  if (!s) return '';
  return String(s)
    .replace(/[ァ-ヶ]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60))
    .toLowerCase()
    .replace(/\s+/g, '');
}

// Generate plausible 18-hole scores summing close to target total
function generateScoresForTarget(target) {
  const arr = Array(18).fill(0);
  const base = Math.floor(target / 18);
  let remainder = target - base * 18;
  for (let i=0;i<18;i++) arr[i] = base;
  let i = 0;
  while (remainder > 0) { arr[i % 18]++; remainder--; i++; }
  // small randomization preserving total
  for (let k=0;k<10;k++) {
    const a = Math.floor(Math.random()*18);
    const b = Math.floor(Math.random()*18);
    if (arr[a] > 3 && arr[b] < 7) { arr[a]--; arr[b]++; }
  }
  return arr;
}

// Try to match a handwritten name string against registered members
function matchMember(rawName, members) {
  const raw = normalizeName(rawName);
  if (!raw) return { member: null, reason: '空文字' };

  // 1. Exact match against name / aliases / yomi
  for (const m of members) {
    const cands = [m.name, ...(m.aliases || []), m.yomi || ''];
    for (const c of cands) {
      if (!c) continue;
      if (normalizeName(c) === raw) {
        const reason = c === m.yomi ? 'よみ一致' : (c === m.name ? '名前一致' : '別名一致');
        return { member: m, reason, confidence: 'high' };
      }
    }
    // last-name (first segment of name) match
    const lastName = (m.name || '').split(/\s+/)[0];
    if (lastName && normalizeName(lastName) === raw) {
      return { member: m, reason: '苗字一致', confidence: 'high' };
    }
  }

  // 2. Substring / partial match
  for (const m of members) {
    const cands = [m.name, ...(m.aliases || []), m.yomi || ''];
    for (const c of cands) {
      if (!c) continue;
      const norm = normalizeName(c);
      if (norm.includes(raw) || raw.includes(norm)) {
        return { member: m, reason: '部分一致', confidence: 'low' };
      }
    }
  }

  return { member: null, reason: '未登録', confidence: 'none' };
}

    <circle cx="40" cy="34" r="22" fill="url(#${gid})" stroke="${p.stroke}" stroke-width="1.5"/>
    <circle cx="40" cy="34" r="18" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <text x="40" y="43" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" font-family="Georgia, serif" style="filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.35));">${rank}</text>
    <path d="M 24 56 L 18 70 L 28 65 L 30 60 Z" fill="${p.ribbon}" stroke="${p.ribbonDark}" stroke-width="0.5"/>
    <path d="M 56 56 L 62 70 L 52 65 L 50 60 Z" fill="${p.ribbon}" stroke="${p.ribbonDark}" stroke-width="0.5"/>
  </svg>`;
}

let currentView = 'timeline';
let currentDetailId = null;
let currentStatsPlayer = null;
let currentEditMemberId = null;
let detailSortKey = 'total'; // 'total' | 'out' | 'in' - ascending (lower is better in golf)

function setView(name, opts={}) {
  currentView = name;
  if (opts.detailId) currentDetailId = opts.detailId;
  if (opts.playerId) currentStatsPlayer = opts.playerId;
  if (opts.memberId !== undefined) currentEditMemberId = opts.memberId;
  document.querySelectorAll('.nav-item').forEach(b => {
    const tabName = ['timeline','ranking','stats','settings'].includes(name) ? name : (['member-edit'].includes(name) ? 'settings' : currentView);
    b.classList.toggle('active', b.dataset.view === tabName);
  });
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function render() {
  const main = document.getElementById('main-content');
  const v = currentView;
  if (v === 'timeline') main.innerHTML = renderTimeline();
  else if (v === 'ranking') main.innerHTML = renderRanking();
  else if (v === 'stats') main.innerHTML = renderStats();
  else if (v === 'settings') main.innerHTML = renderSettings();
  else if (v === 'detail') main.innerHTML = renderDetail();
  else if (v === 'add-round') main.innerHTML = renderAddRound();
  else if (v === 'member-edit') main.innerHTML = renderMemberEdit();
  attachHandlers();
}

/* ---------- TIMELINE ---------- */
function renderTimeline() {
  const sorted = [...state.rounds].sort((a,b)=> b.date.localeCompare(a.date));
  if (!sorted.length) {
    return `<div class="empty">まだラウンド記録がありません<br>右下の「＋」から追加してみてください</div>`;
  }
  const cards = sorted.map(r => {
    const bestArr = bestOfRound(r);
    const bestIds = bestArr.map(([pid]) => pid);
    const players = roundParticipants(r);
    const scoreList = players.map(pid => {
      const isBest = bestIds.includes(pid);
      const s = r.scores[pid].total;
      return `<span ${isBest?'class="crown"':''}>${memberName(pid)} ${s}${isBest?' 👑':''}</span>`;
    }).join('　');
    const firstPhoto = r.photos[0];
    const photoSrc = firstPhoto ? (firstPhoto.url || firstPhoto.dataUrl) : null;
    const photoHTML = photoSrc
      ? `<div class="round-photo" style="background-image:url(${photoSrc})"></div>`
      : `<div class="round-photo empty">${r.photos.length > 0 ? '今日の一枚' : '写真なし'}</div>`;
    return `
      <div class="round-card" data-round-id="${r.id}">
        <div class="round-header">
          <div class="round-meta">
            <div class="round-tags">
              <span class="tag">${fmtDate(r.date)}</span>
              <span class="tag tag-accent">${r.weather}</span>
            </div>
            <div class="round-course">${r.course}</div>
          </div>
          ${bestArr.length ? `<div class="round-best">
            <div class="round-best-label">BEST</div>
            <div class="round-best-score">${bestArr[0][1].total}</div>
          </div>` : ''}
        </div>
        <div class="round-body">
          <div class="round-scores">${scoreList}</div>
          ${photoHTML}
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="view">
      <div class="section-heading"><span>最近のラウンド</span><span style="text-transform:none; letter-spacing:0;">${sorted.length}件</span></div>
      ${cards}
    </div>
  `;
}

/* ---------- RANKING ---------- */
function renderRanking() {
  const stats = computeAllStats();
  const totalRounds = state.rounds.length;
  const allScores = state.rounds.flatMap(r => Object.values(r.scores).map(s=>s.total));
  const groupAvg = allScores.length ? (allScores.reduce((a,b)=>a+b,0)/allScores.length).toFixed(1) : '-';
  const allTimeBest = allScores.length ? Math.min(...allScores) : '-';

  const byAvg = [...stats].filter(s => s.rounds > 0).sort((a,b)=> a.avg - b.avg);
  const byBest = [...stats].filter(s => s.best !== null).sort((a,b)=> a.best - b.best);
  const byRounds = [...stats].sort((a,b)=> b.rounds - a.rounds);

  let medalIdCounter = 0;
  // Standard competition ranking: ties share the same rank, next rank skips ahead (1, 1, 3, 4 ...)
  const rankWithTies = (arr, key) => {
    let prev = undefined;
    let prevRank = 0;
    return arr.map((item, idx) => {
      const v = item[key];
      const rank = (idx > 0 && v === prev) ? prevRank : (idx + 1);
      prev = v; prevRank = rank;
      return { item, rank };
    });
  };
  const rankRow = (s, rank, valKey, valSuffix='') => {
    const rowClass = rank <= 3 ? `top-${rank}` : '';
    const rankDisplay = rank <= 3 ? medalSvg(rank, medalIdCounter++) : `<div class="rank-num-plain">${rank}</div>`;
    return `
      <div class="ranking-row ${rowClass}">
        ${rankDisplay}
        <div class="rank-name">
          <div class="user-avatar">${s.initial}</div>
          ${s.name}
        </div>
        <div class="rank-score">${s[valKey]}${valSuffix}</div>
        <div class="rank-rounds">${s.rounds}R</div>
      </div>
    `;
  };

  return `
    <div class="view">
      <div class="section-heading"><span>グループ全体</span></div>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">累計ラウンド</div><div class="kpi-value">${totalRounds}</div></div>
        <div class="kpi-card"><div class="kpi-label">グループ平均</div><div class="kpi-value">${groupAvg}</div></div>
        <div class="kpi-card"><div class="kpi-label">全体ベスト</div><div class="kpi-value">${allTimeBest}</div></div>
        <div class="kpi-card"><div class="kpi-label">メンバー</div><div class="kpi-value">${state.members.length}</div></div>
      </div>

      <div class="section-heading"><span>平均スコア ランキング</span></div>
      <div class="ranking-table">
        <div class="ranking-row header"><div>順位</div><div>名前</div><div style="text-align:right;">平均</div><div style="text-align:right;">R数</div></div>
        ${rankWithTies(byAvg, 'avg').map(({item, rank}) => rankRow(item, rank, 'avg')).join('')}
        ${!byAvg.length ? '<div class="empty">データなし</div>' : ''}
      </div>

      <div class="section-heading"><span>ベストスコア</span></div>
      <div class="ranking-table">
        <div class="ranking-row header"><div>順位</div><div>名前</div><div style="text-align:right;">ベスト</div><div style="text-align:right;">R数</div></div>
        ${rankWithTies(byBest, 'best').map(({item, rank}) => rankRow(item, rank, 'best')).join('')}
        ${!byBest.length ? '<div class="empty">データなし</div>' : ''}
      </div>

      <div class="section-heading"><span>参加回数</span></div>
      <div class="ranking-table">
        <div class="ranking-row header"><div>順位</div><div>名前</div><div style="text-align:right;">参加</div><div style="text-align:right;">平均</div></div>
        ${rankWithTies(byRounds, 'rounds').map(({item, rank}) => rankRow(item, rank, 'rounds','回')).join('')}
      </div>
    </div>
  `;
}

function computeAllStats() {
  return state.members.map(m => {
    const myScores = state.rounds
      .filter(r => r.scores[m.id])
      .map(r => ({ date: r.date, total: r.scores[m.id].total, course: r.course }));
    const totals = myScores.map(s=>s.total);
    return {
      id: m.id, name: m.name, initial: m.initial,
      rounds: myScores.length,
      avg: totals.length ? (totals.reduce((a,b)=>a+b,0)/totals.length).toFixed(1) : '-',
      best: totals.length ? Math.min(...totals) : null,
      worst: totals.length ? Math.max(...totals) : null,
      recent: myScores.sort((a,b)=> b.date.localeCompare(a.date)).slice(0, 8).reverse(),
    };
  });
}

/* ---------- INDIVIDUAL STATS ---------- */
function renderStats() {
  const stats = computeAllStats();
  const selectedId = currentStatsPlayer || state.me;
  const me = stats.find(s => s.id === selectedId) || stats[0];

  const chips = state.members.map(m => `
    <div class="player-pick-chip ${m.id===selectedId?'active':''}" data-player="${m.id}">${m.name}</div>
  `).join('');

  const maxScore = Math.max(...me.recent.map(r=>r.total), 100);
  const minScore = Math.min(...me.recent.map(r=>r.total), 60);
  const range = Math.max(maxScore - minScore, 10);
  const bars = me.recent.length ? me.recent.map(r => {
    const h = Math.max(((r.total - minScore + 5) / (range + 10)) * 80, 8);
    return `<div class="recent-bar" style="height:${h}%;">
      <div class="bar-label">${r.total}</div>
      <div class="bar-date">${fmtDateShort(r.date)}</div>
    </div>`;
  }).join('') : '<div class="empty" style="width:100%; padding:20px;">記録なし</div>';

  return `
    <div class="view">
      <div class="section-heading"><span>個人成績</span></div>
      <div class="player-pick">${chips}</div>

      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">参加ラウンド</div><div class="kpi-value">${me.rounds}</div></div>
        <div class="kpi-card"><div class="kpi-label">平均スコア</div><div class="kpi-value">${me.avg}</div></div>
        <div class="kpi-card"><div class="kpi-label">ベスト</div><div class="kpi-value">${me.best ?? '-'}</div></div>
        <div class="kpi-card"><div class="kpi-label">ワースト</div><div class="kpi-value">${me.worst ?? '-'}</div></div>
      </div>

      <div class="stat-graph">
        <div class="graph-title">直近の推移</div>
        <div style="padding: 24px 0 22px;">
          <div class="recent-rounds-mini">${bars}</div>
        </div>
      </div>
    </div>
  `;
}

/* ---------- ROUND DETAIL ---------- */
function renderDetail() {
  const r = state.rounds.find(x => x.id === currentDetailId);
  if (!r) return `<div class="empty">ラウンドが見つかりません</div>`;
  const bestArr = bestOfRound(r);
  const players = roundParticipants(r);

  // Determine if this round is in OUT/IN-only mode (any player with no detailed holes)
  const normalizedScoresRaw = players.map(pid => ({ pid, sc: normalizeScore(r.scores[pid]) }));
  const allOutInOnly = normalizedScoresRaw.length > 0 && normalizedScoresRaw.every(({sc}) => isOutInOnly(sc));

  // Sort by selected key ascending (lower = better in golf)
  const sortKey = detailSortKey;
  const normalizedScores = normalizedScoresRaw.slice().sort((a, b) => (a.sc[sortKey]||9999) - (b.sc[sortKey]||9999));
  const sortArrow = (key) => sortKey === key ? '<span style="color:var(--primary); font-size:11px;">↓</span>' : '';
  const sortableHeader = (key, label) =>
    `<th data-sort-key="${key}" style="cursor:pointer; ${sortKey===key?'background:var(--primary-bg); color:var(--primary-dark);':''}" title="${label}順に並べ替え（少ない順）">${label}${sortArrow(key)}</th>`;

  const scorecard = allOutInOnly
    ? `<div class="scorecard-wrap">
        <table class="scorecard scorecard-compact">
          <thead><tr><th>名前</th>${sortableHeader('out','OUT')}${sortableHeader('in','IN')}${sortableHeader('total','計')}</tr></thead>
          <tbody>
            ${normalizedScores.map(({pid, sc}) => `<tr>
              <td>${memberName(pid)}</td>

          </thead>
          <tbody>
            ${normalizedScores.map(({pid, sc}) => `<tr>
              <td>${memberName(pid)}</td>
              ${sc.holes.slice(0,9).map(h=>`<td>${h||'-'}</td>`).join('')}
              <td class="total-cell">${sc.out}</td>
              ${sc.holes.slice(9,18).map(h=>`<td>${h||'-'}</td>`).join('')}
              <td class="total-cell">${sc.in}</td>
              <td class="total-cell">${sc.total}</td>

          </tbody>

    <div class="detail-photo" ${hasImg?`data-photo-idx="${idx}"`:''} style="${hasImg?`background-image:url(${p.url||p.dataUrl}); cursor:zoom-in;`:'cursor:default;'}">
      ${!hasImg ? `<div style="display:flex; align-items:center; justify-content:center; height:100%; color: var(--text-muted); font-size: 11px;">${memberInitial(p.memberId)}の一枚</div>`:''}
      ${p.caption ? `<div class="caption">${memberInitial(p.memberId)}: ${p.caption}</div>` : ''}
    </div>`;
  }).join('') : '<div class="empty" style="grid-column: 1/-1;">写真はまだありません</div>';

  const commentsHTML = r.comments.length ? r.comments.map(c => `
    <div class="comment-card">
      <div class="comment-author">${memberName(c.memberId)}</div>
      <div class="comment-text">${c.text}</div>
    </div>
  `).join('') : '<div class="empty">コメントはまだありません</div>';

  return `
    <div class="view">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px;">
        <button class="btn btn-ghost" id="back-btn" style="padding: 6px 10px;">← 戻る</button>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-secondary" id="edit-round-btn" style="padding: 6px 14px; font-size: 13px;">編集</button>

/* ---------- ADD ROUND ---------- */
let draftRound = null;
let editingRoundId = null;
function initDraft(existingRound = null) {
  if (existingRound) {
    editingRoundId = existingRound.id;
    // detect OUT/IN-only mode from existing data
    const scoresEntries = Object.values(existingRound.scores || {});
    const outInOnly = scoresEntries.length > 0 && scoresEntries.every(isOutInOnly);
    draftRound = {
      id: existingRound.id,
      date: existingRound.date,
      course: existingRound.course,
      weather: existingRound.weather,
      scores: JSON.parse(JSON.stringify(existingRound.scores)),
      photos: existingRound.photos.map(p => ({...p})),
      comments: existingRound.comments.map(c => ({...c})),
      selectedMembers: Object.keys(existingRound.scores),
      outInOnly,
    };
    // ensure normalized shape
    Object.keys(draftRound.scores).forEach(mid => {
      draftRound.scores[mid] = normalizeScore(draftRound.scores[mid]);
    });
  } else {
    editingRoundId = null;
    draftRound = {
      id: 'r' + Date.now(),
      date: new Date().toISOString().slice(0,10),
      course: '',
      weather: '晴れ',
      scores: {},
      photos: [],
      comments: [],
      selectedMembers: [state.me],
      outInOnly: false,
    };
    draftRound.scores[state.me] = { holes: Array(18).fill(0), out: 0, in: 0, total: 0 };
  }
}

function renderAddRound() {
  if (!draftRound) initDraft();
  const d = draftRound;

  const memberChips = state.members.map(m => `
    <div class="member-chip ${d.selectedMembers.includes(m.id)?'selected':''}" data-member="${m.id}">
      <span class="check">${d.selectedMembers.includes(m.id)?'✓':''}</span>
      ${m.name}
    </div>
  `).join('');

  const weatherOptions = ['晴れ','曇り','雨','風強','寒い','暑い'];
  const weatherChips = weatherOptions.map(w =>
    `<span class="weather-chip ${d.weather===w?'selected':''}" data-weather="${w}">${w}</span>`
  ).join('');

  // Build player swap dropdown options for a given current pid
  const swapOptionsFor = (currentPid) => state.members.map(m => {
    const taken = d.selectedMembers.includes(m.id) && m.id !== currentPid;
    return `<option value="${m.id}" ${m.id===currentPid?'selected':''} ${taken?'disabled':''}>${m.name}${taken?'（参加済）':''}</option>`;
  }).join('');

  const playerCell = (pid) => `<td><select class="player-swap-select" data-current-pid="${pid}" title="このプレイヤーを別の人に差し替え">${swapOptionsFor(pid)}</select></td>`;

  const scorecardRows = d.selectedMembers.map(pid => {
    const sc = normalizeScore(d.scores[pid] || {});
    if (d.outInOnly) {
      return `<tr data-player-row="${pid}">
        ${playerCell(pid)}
        <td><input class="hole-input" data-player="${pid}" data-field="out" type="number" min="0" max="80" value="${sc.out||''}" style="width:64px;"></td>
        <td><input class="hole-input" data-player="${pid}" data-field="in" type="number" min="0" max="80" value="${sc.in||''}" style="width:64px;"></td>
        <td class="total-cell" data-total="${pid}">${sc.total||'-'}</td>
      </tr>`;
    }
    return `<tr data-player-row="${pid}">
      ${playerCell(pid)}
      ${sc.holes.slice(0,9).map((h,i)=>`<td><input class="hole-input" data-player="${pid}" data-hole="${i}" type="number" min="1" max="15" value="${h||''}"></td>`).join('')}
      <td class="total-cell" data-out="${pid}">${sc.out||'-'}</td>
      ${sc.holes.slice(9,18).map((h,i)=>`<td><input class="hole-input" data-player="${pid}" data-hole="${i+9}" type="number" min="1" max="15" value="${h||''}"></td>`).join('')}
      <td class="total-cell" data-in="${pid}">${sc.in||'-'}</td>
      <td class="total-cell" data-total="${pid}">${sc.total||'-'}</td>
    </tr>`;
  }).join('');

  const scorecardHeader = d.outInOnly
    ? `<tr><th>名前</th><th>OUT</th><th>IN</th><th>計</th></tr>`
    : `<tr><th>名前</th>${Array.from({length:9},(_,i)=>`<th>${i+1}</th>`).join('')}<th>OUT</th>${Array.from({length:9},(_,i)=>`<th>${i+10}</th>`).join('')}<th>IN</th><th>計</th></tr>`;

  const photoSlots = [0,1].map(idx => {
    const p = d.photos[idx];
    const previewSrc = p ? (p.previewDataUrl || p.url || p.dataUrl) : null;
    return `<label class="photo-upload ${p?'has-image':''}" data-photo-idx="${idx}" style="${previewSrc?`background-image:url(${previewSrc})`:''}">
      ${!p ? `<span class="photo-icon">📷</span><span>今日の一枚 #${idx+1}</span>` : `<span class="photo-remove" data-remove-photo="${idx}">×</span>`}
      <input type="file" accept="image/*" data-photo-input="${idx}">
    </label>`;
  }).join('');

  const isEdit = !!editingRoundId;
  const myExistingComment = (d.comments.find(c => c.memberId === state.me) || {}).text || '';

  return `
    <div class="view">
      <button class="btn btn-ghost" id="back-btn" style="margin-bottom: 10px; padding: 6px 10px;">← 戻る</button>
      <div class="section-heading"><span>${isEdit ? 'ラウンドを編集' : '新しいラウンド'}</span></div>

      <div class="form-row form-section">
        <div>
          <label class="form-label">日付</label>
          <input class="form-input" type="date" id="draft-date" value="${d.date}">
        </div>
        <div>
          <label class="form-label">天気</label>
          <div class="weather-row">${weatherChips}</div>
        </div>
      </div>

      <div class="form-section">
        <label class="form-label">コース名</label>
        <input class="form-input" type="text" id="draft-course" value="${d.course}" placeholder="例：霞ヶ関カンツリー倶楽部">
      </div>

      <div class="form-section">
        <label class="form-label">参加メンバー</label>
        <div class="member-grid">${memberChips}</div>
      </div>

      <div class="form-section">
        <label class="form-label">スコアカード${d.outInOnly?'（OUT/IN合計のみ）':'（ホールごと打数）'}</label>
        <div style="background: var(--primary-bg); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; display:flex; align-items:center; gap:10px;">
          <span style="font-size:22px;">📷</span>
          <div style="flex:1;">
            <div style="font-size:13px; font-weight:600; color: var(--primary-dark);">スコアカード写真からAIで読み取る (β)</div>
            <div style="font-size:11px; color: var(--text-secondary);">AIが詳細/OUT/IN形式を自動判別します</div>
          </div>
          <button class="btn" id="ocr-trigger" style="padding: 8px 14px; font-size: 13px;">読み取り</button>
        </div>

        <div style="display:flex; align-items:center; gap:10px; margin-bottom: 10px; padding: 8px 12px; background: var(--surface-2); border-radius: var(--radius-md);">
          <span style="font-size: 12px; color: var(--text-secondary);">入力モード：</span>
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size: 13px;">
            <input type="radio" name="score-mode" value="detail" ${!d.outInOnly?'checked':''} id="mode-detail" style="cursor:pointer;">
            18ホール詳細
          </label>
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size: 13px;">
            <input type="radio" name="score-mode" value="outin" ${d.outInOnly?'checked':''} id="mode-outin" style="cursor:pointer;">
            OUT/IN合計のみ
          </label>
        </div>

        <div class="scorecard-wrap">
          <table class="scorecard ${d.outInOnly?'scorecard-compact':''}">
            <thead>${scorecardHeader}</thead>
            <tbody id="draft-scorecard">${scorecardRows}</tbody>
          </table>
        </div>
        <div class="help-text" style="margin-top:6px;">※ 名前のプルダウンで、スコアはそのまま別メンバーに差し替えられます（AI読み取り後の修正に便利）</div>
      </div>

      <div class="form-section">
        <label class="form-label">今日の一枚（最大2枚）</label>
        <div class="photo-row">${photoSlots}</div>
        <div class="help-text">基本はLINEに、ここには厳選した1〜2枚を。</div>
      </div>

      <div class="form-section">
        <label class="form-label">コメント（任意）</label>
        <textarea class="form-textarea" id="draft-comment" placeholder="振り返り・感想を一言">${myExistingComment}</textarea>
      </div>

      <div style="display:flex; gap:10px; margin-top: 20px;">
        <button class="btn btn-secondary" id="cancel-add">キャンセル</button>
        <button class="btn btn-full" id="save-round">${isEdit ? '更新する' : '記録する'}</button>
      </div>
    </div>
  `;
}
